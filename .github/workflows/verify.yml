name: Historian verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: historian_admin
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: line_historian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U historian_admin -d line_historian"
          --health-interval 3s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: historian_admin
      PGPASSWORD: ci-local-only
      PGDATABASE: line_historian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historian-evidence
          path: docs/results
